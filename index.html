    <!---- Header ---->

    <!---- Main Content ---->
    <main id="questionContainer">
      <div class="image-gif">
        <img id="imgBefore" src="./assets/images/cartoon2.gif" alt="" />
      </div>
      <h2 id="textBefore" class="doYou">คุณชอบผมไหม ?</h2>
      <div class="message" id="message"></div>
      <div id="button-flex">
        <button id="yesBtn" type="button" class="btn">Yes</button>
        <button
          id="noBtn"
          type="button"
          class="btn"
          style="
            transition:
              top 0.3s ease,
              left 0.3s ease;
          "
        >
          No
        </button>
      </div>
    </main>
    <div id="heart-container"></div>
    <audio
      id="cheerSound"
      src="./assets/images/mixkit-small-group-light-applause-517.wav"
      preload="auto"
      loop
    ></audio>

    <!---- Footer ---->

    <script src="./assets/js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2/dist/confetti.browser.min.js"></script>
    <script>
      const noBtn = document.getElementById("noBtn");
      const questionContainer = document.getElementById("questionContainer");

      let enlarged = false;

      noBtn.addEventListener("mouseover", () => {
        // เพิ่ม class แค่ครั้งแรก
        if (!enlarged) {
          noBtn.classList.add("enlarged");
          enlarged = true;
        }

        // ทำให้ปุ่มหนี
        const newX = Math.floor(
          Math.random() * (questionContainer.offsetWidth - noBtn.offsetWidth),
        );
        const newY = Math.floor(
          Math.random() * (questionContainer.offsetHeight - noBtn.offsetHeight),
        );

        noBtn.style.position = "absolute";
        noBtn.style.left = `${newX}px`;
        noBtn.style.top = `${newY}px`;
      });
