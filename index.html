<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe7ee" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/images/ticker.jpg" />

    <!-- Primary Meta Tags -->
    <title>💌 มีเรื่องจะบอก...</title>
    <meta name="title" content="💌 มีเรื่องจะบอก..." />
    <meta name="description" content="เปิดดูหน่อยได้ไหม มีอะไรอยากบอก 🥺" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://matthew-frontend.github.io/Fang/"
    />
    <meta property="og:title" content="💌 มีเรื่องจะบอก..." />
    <meta
      property="og:description"
      content="เปิดดูหน่อยได้ไหม มีอะไรอยากบอก 🥺"
    />
    <meta
      property="og:image"
      content="https://matthew-frontend.github.io/Fang/assets/images/cartoon2.gif"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://matthew-frontend.github.io/Fang/"
    />
    <meta property="twitter:title" content="💌 มีเรื่องจะบอก..." />
    <meta
      property="twitter:description"
      content="เปิดดูหน่อยได้ไหม มีอะไรอยากบอก 🥺"
    />
    <meta
      property="twitter:image"
      content="https://matthew-frontend.github.io/Fang/assets/images/cartoon2.gif"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Pangolin&display=swap"
      rel="stylesheet"
    />

    <!-- Style -->
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>

  <body>
    <!---- ฉากหลัง: วงกลมเบลอ + หัวใจลอย ---->
    <div class="bg-decor" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>

    <!---- ปุ่มเปิด/ปิดเสียง ---->
    <button
      id="soundToggle"
      type="button"
      class="sound-toggle"
      aria-label="เปิดเสียง"
      title="เปิด/ปิดเสียง"
    >
      🔇
    </button>

    <!---- Main Content ---->
    <main id="questionContainer">
      <div class="card">
        <div class="image-gif">
          <span class="sticker sticker--tl">💕</span>
          <span class="sticker sticker--tr">✨</span>
          <span class="sticker sticker--br">🌸</span>
          <img
            id="imgBefore"
            src="./assets/images/cartoon2.gif"
            alt="ตัวการ์ตูนน่ารักกำลังรอคำตอบ"
          />
        </div>

        <h2 id="textBefore" class="doYou">คุณชอบผมไหม ?</h2>
        <p class="subtitle">ตอบตามใจเลยนะ !</p>

        <div class="message" id="message"></div>

        <div id="button-flex">
          <button id="yesBtn" type="button" class="btn">ชอบสิ 💗</button>
          <button id="noBtn" type="button" class="btn">ไม่ชอบ</button>
        </div>
      </div>
    </main>

    <div id="heart-container" aria-hidden="true"></div>

    <audio
      id="cheerSound"
      src="./assets/images/mixkit-small-group-light-applause-517.wav"
      preload="auto"
      loop
    ></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2/dist/confetti.browser.min.js"></script>
    <script src="./assets/js/main.js" defer></script>
  </body>
</html>
